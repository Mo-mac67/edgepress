name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck + Lint + Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  integration:
    name: Integration API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: node tests/integration/run.mjs

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t edgepress:ci -f apps/web/Dockerfile .

      - name: Run container
        run: |
          docker run -d --name edgepress -p 3000:3000 -v edgepress-ci-data:/data edgepress:ci
          # Wait for the server to answer (up to ~90s)
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/setup || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/setup | grep -q '"done":false'

      - name: Smoke test (setup → login → page live)
        run: |
          set -e
          JAR=$(mktemp)
          # First-run setup creates the Owner account
          curl -sf -c "$JAR" -X POST http://localhost:3000/api/setup \
            -H 'Content-Type: application/json' \
            -d '{"siteName":"CI Smoke","password":"ci-password-1"}' | grep -q '"ok":true'
          # Login works
          curl -sf -b "$JAR" -c "$JAR" -X POST http://localhost:3000/api/admin/login \
            -H 'Content-Type: application/json' \
            -d '{"password":"ci-password-1"}' | grep -q '"role":"super"'
          # Public pages render
          curl -sf -o /dev/null http://localhost:3000/en
          curl -sf -o /dev/null http://localhost:3000/sitemap.xml
          # Content API 404s an unknown type (route wired)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/content/nope)
          [ "$code" = "404" ]
          echo "Docker smoke test passed"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs edgepress

  installer:
    name: Installer scaffolds a buildable project
    runs-on: ubuntu-latest
    # The published create-edgepress once shipped a scaffold with no
    # packages/{core,ai} while tsconfig still aliased @edgepress/* at it, so
    # `npx create-edgepress` produced a project that could not build — and
    # nothing caught it. This job runs the CLI exactly as a new user would.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Scaffold from this commit's CLI
        run: |
          node packages/create-edgepress/bin/index.mjs my-site --no-install
        env:
          # Pull the template from the branch under test, not from main.
          EDGEPRESS_REPO: ${{ github.repository }}
          EDGEPRESS_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: The scaffold must be self-contained
        run: |
          cd my-site
          test -d packages/core/src || { echo "::error::scaffold is missing packages/core"; exit 1; }
          test -d packages/ai/src   || { echo "::error::scaffold is missing packages/ai"; exit 1; }
          # aliases must point inside the scaffold, not at a monorepo parent
          grep -q '"@edgepress/core": \["./packages/core/src/index.ts"\]' tsconfig.json \
            || { echo "::error::tsconfig @edgepress aliases were not rewritten"; exit 1; }
          # no personal deploy config may ever ship in a scaffold
          ! grep -rqE 'cfat_|CLOUDFLARE_API_TOKEN=' . || { echo "::error::scaffold contains a credential"; exit 1; }

      - name: It must actually build
        run: |
          cd my-site
          npm install --no-audit --no-fund
          npm run build
